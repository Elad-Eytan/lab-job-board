name: Job Board CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  lint-test-python:
    name: lint-test-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: jobs-service/requirements.txt

      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip ruff pytest httpx && python -m pip install -r requirements.txt

      - name: Lint Python code
        run: ruff check --select E4,E7,E9,F app tests

      - name: Run Python tests
        run: python -m pytest -v tests

  lint-test-node:
    name: lint-test-node
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [applications-service, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=critical

  build-images:
    name: build-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: jobs-service
            context: jobs-service
          - image: applications-service
            context: applications-service
          - image: frontend
            context: frontend
          - image: nginx
            context: nginx
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          push: false
          tags: jobboard-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-images:
    name: scan-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: jobs-service
            context: jobs-service
          - image: applications-service
            context: applications-service
          - image: frontend
            context: frontend
          - image: nginx
            context: nginx
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load ${{ matrix.image }} for scanning
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          load: true
          push: false
          tags: jobboard-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha

      - name: Scan ${{ matrix.image }} with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jobboard-${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.image }}-report
          path: trivy-${{ matrix.image }}.sarif
          if-no-files-found: error

  integration-test:
    name: integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start application
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Verify application and API responses
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error http://localhost/ > /dev/null

          health="$(docker compose exec -T jobs-service python -c \
            'import urllib.request; print(urllib.request.urlopen("http://localhost:8000/health").read().decode())')"
          python -c 'import json,sys; assert json.loads(sys.argv[1])["status"] == "healthy"' "$health"

          jobs="$(curl --fail --silent --show-error http://localhost/api/jobs)"
          python -c 'import json,sys; assert isinstance(json.loads(sys.argv[1]), list)' "$jobs"

          status="$(curl --silent --show-error --output /tmp/job.json --write-out '%{http_code}' \
            --request POST http://localhost/api/jobs \
            --header 'Content-Type: application/json' \
            --data '{"title":"CI Test Job","description":"Created by the integration test","company":"CI Labs","location":"GitHub Actions"}')"
          test "$status" = "201"
          python -c 'import json; data=json.load(open("/tmp/job.json")); assert data["title"] == "CI Test Job" and data["id"]'

          curl --fail --silent --show-error http://localhost/api/applications > /dev/null

      - name: Show container status and logs on failure
        if: failure()
        run: docker compose ps --all && docker compose logs --no-color

      - name: Stop application
        if: always()
        run: docker compose down --volumes

  push-to-registry:
    name: push-to-registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint-test-python
      - lint-test-node
      - build-images
      - scan-images
      - integration-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: jobs-service
            context: jobs-service
          - image: applications-service
            context: applications-service
          - image: frontend
            context: frontend
          - image: nginx
            context: nginx
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jobboard-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jobboard-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
